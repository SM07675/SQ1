[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "satquery-landcover-pipeline"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "scikit-image>=0.22,<1",
  "rasterio>=1.3,<2",
  "pyproj>=3.6,<4",
  "torch>=2.2",
  "torchvision>=0.17",
  "segmentation-models-pytorch>=0.5,<1"
]

[project.optional-dependencies]
train = ["albumentations>=1.4,<3", "timm>=1.0,<2", "matplotlib>=3.8,<4", "tqdm>=4.66,<5"]
test = ["pytest>=8,<9"]

[project.scripts]
satquery-infer = "satquery.cli:main"

[tool.setuptools.packages.find]
include = ["satquery*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest_tmp"
