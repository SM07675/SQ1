[project]
name = "satquery-geoproof-api"
version = "1.0.0"
description = "Evidence-first spectral, temporal and optical-SAR analysis API for SIH26167"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "python-multipart>=0.0.20,<1",
  "pydantic>=2.11,<3",
  "numpy>=2.2,<3",
  "rasterio>=1.4,<2",
  "Pillow>=11,<13",
  "shapely>=2.1,<3",
  "pyproj>=3.7,<4",
  "scipy>=1.13,<2",
  "httpx>=0.28,<1",
  "reportlab>=4.4,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1,<2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
